---
- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - docker-buildx
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true
  ignore_errors: true

- name: Install python3-debian
  ansible.builtin.apt:
    name:
      - python3-debian
      - ca-certificates
      - curl
    update_cache: true
    state: present

- name: Add Docker repository (DEB822 format)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    state: present
    enabled: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ pkg_docker }}"

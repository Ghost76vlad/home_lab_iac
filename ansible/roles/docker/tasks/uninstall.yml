---
- name: Remove Docker packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
  loop: "{{ pkg_docker }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: Remove Docker repository (DEB822 format)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    state: absent
  when: ansible_facts['os_family'] == 'Debian'

- name: Install Docker packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: absent
  loop: "{{ pkg_docker }}"
  when: ansible_facts['os_family'] == "RedHat"

- name: Add Docker CE repository (RHEL compatible)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "https://download.docker.com/linux/rhel/{{ ansible_facts['distribution_major_version'] }}/$basearch/stable"
    enabled: true
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/rhel/gpg
    state: absent
  when: ansible_facts['os_family'] == "RedHat"

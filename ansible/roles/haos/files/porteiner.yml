services:
  portainer:
    image: portainer/portainer-ce:alpine-sts
    container_name: portainer
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - LOG_LEVEL=INFO

    ports:
      - "8000:8000"
      - "9443:9443" # Только HTTPS
      - "9000:9000" # Раскомментируйте если нужен HTTP

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/portainer/data:/data
      - /data/portainer/backups:/backups
      - /data/portainer/certs:/certs:ro

    command: --sslcert /certs/cert.pem --sslkey /certs/key.pem

    networks:
      - portainer_network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "https://localhost:9443",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer_agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      - LOG_LEVEL=INFO
    networks:
      - portainer_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9001",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  portainer_network:
    driver: bridge
    name: portainer_network

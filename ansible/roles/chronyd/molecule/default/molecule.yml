driver:
  name: default
  options:
    managed: false
platforms:
  - name: develop
    # Здесь можно указать параметры подключения
    ansible_host: 10.10.10.59
    ansible_user: "ansible"
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    # ansible_password: ваш_пароль (если без ключа)
provisioner:
  name: "ansible"
verifier:
  name: testinfra
  options:
    v: true
    sudo: true
